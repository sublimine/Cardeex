name: Verify foundation

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install pinned verification dependencies
        run: python -m pip install -r tools/requirements-verify.txt
      - name: Verify offline design contracts and finite models
        run: python tools/verify_foundation.py
      - name: Test offline discovery implementation and adversarial fixtures
        run: python -m unittest discover -s tests/discovery -p 'test_*.py' -v
      - name: Check tracked whitespace and working-tree cleanliness
        run: |
          git show --format= --check HEAD
          git diff --exit-code
